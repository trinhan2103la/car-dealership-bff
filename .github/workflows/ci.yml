name: ci

# Ngày 19 (ADR-011): CI riêng cho repo BFF (NestJS 12 ESM, test bằng vitest).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      # eslint config thêm sau (plan Ngày 19 nhắc eslint). Bật khi có file cấu hình.
      - name: Lint
        if: ${{ hashFiles('eslint.config.js', 'eslint.config.mjs', '.eslintrc.cjs', '.eslintrc.json') != '' }}
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: E2E tests
        run: pnpm test:e2e
      - name: Build
        run: pnpm build

  # Ngày 20 (Req 21, 29.2): chặn secret lộ, lỗ hổng npm mức high, và scope @volo/ (commercial).
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Repo thuộc tài khoản cá nhân nên gitleaks-action không cần license key.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Dependency audit (chặn high/critical)
        run: pnpm audit --audit-level=high
      - name: Cấm npm scope @volo/
        run: |
          if grep -nE '@volo/' package.json pnpm-lock.yaml; then
            echo "::error::Phat hien scope @volo/ (commercial) trong package.json/pnpm-lock.yaml."
            exit 1
          fi

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
